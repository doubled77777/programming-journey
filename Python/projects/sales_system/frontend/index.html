<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales System - Checkout</title>

    <script src="https://sdk.mercadopago.com/js/v2"></script>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 480px;
            margin: 40px auto;
            padding: 0 16px;
            color: #222;
        }

        #seleccion_producto {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        select, input, button {
            padding: 8px;
            font-size: 1rem;
        }

        #mensaje {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
        }

        #mensaje.success { background: #e6f4ea; color: #1e7e34; display: block; }
        #mensaje.error { background: #fdecea; color: #b3261e; display: block; }

        button:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>

<body>

    <h1>Sales System</h1>
    <h2>Checkout</h2>

    <div id="mensaje"></div>

    <div id="seleccion_producto">
        <label for="producto">Producto:</label>
        <select id="producto"></select>

        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" min="1" value="1">

        <button id="btn_continuar">Continuar al pago</button>
    </div>

    <div id="cardPaymentBrick_container"></div>

    <script>
        const mp = new MercadoPago("APP_USR-d2252a3a-d144-4053-b917-c4ee0a6b2b21", {
            locale: "es-PE"
        });

        const bricksBuilder = mp.bricks();

        const mensajeDiv = document.getElementById("mensaje");
        const btnContinuar = document.getElementById("btn_continuar");
        const selectProducto = document.getElementById("producto");
        const inputCantidad = document.getElementById("cantidad");

        let productos = [];

        // Se genera una sola vez por intento de compra y se reutiliza si el
        // usuario reintenta (por ejemplo, tras un error de red). El backend
        // usa este mismo valor para no procesar dos veces el mismo pago.
        let clientRequestId = null;

        const mostrarMensaje = (texto, tipo) => {
            mensajeDiv.textContent = texto;
            mensajeDiv.className = tipo;
        };

        const ocultarMensaje = () => {
            mensajeDiv.className = "";
            mensajeDiv.style.display = "none";
        };

        const cargarProductos = async () => {
            try {
                const response = await fetch("http://localhost:5000/productos");
                if (!response.ok) {
                    throw new Error("Respuesta no exitosa del servidor");
                }
                productos = await response.json();

                selectProducto.innerHTML = "";
                productos.forEach((producto) => {
                    const opcion = document.createElement("option");
                    opcion.value = producto.id;
                    opcion.textContent =
                        `${producto.nombre} - S/ ${producto.precio} (stock: ${producto.stock})`;
                    selectProducto.appendChild(opcion);
                });
            } catch (error) {
                mostrarMensaje(
                    "No se pudo conectar con el servidor. ¿Está Flask corriendo en el puerto 5000?",
                    "error"
                );
            }
        };

        const renderCardPaymentBrick = async (amount, productoId, cantidad) => {
            if (window.cardPaymentBrickController) {
                await window.cardPaymentBrickController.unmount();
            }

            if (!clientRequestId) {
                clientRequestId = crypto.randomUUID();
            }

            const settings = {
                initialization: { amount },

                callbacks: {
                    onReady: () => {},

                    onSubmit: async (cardFormData) => {
                        const datosVenta = {
                            ...cardFormData,
                            producto_id: productoId,
                            cantidad: cantidad,
                            client_request_id: clientRequestId
                        };

                        try {
                            const response = await fetch(
                                "http://localhost:5000/process_order",
                                {
                                    method: "POST",
                                    headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify(datosVenta)
                                }
                            );

                            const resultado = await response.json();

                            if (response.ok && resultado.status === "success") {
                                mostrarMensaje(
                                    `Pago aprobado. Total: S/ ${resultado.total}`,
                                    "success"
                                );
                                clientRequestId = null; // la próxima compra es una solicitud nueva
                                await cargarProductos();
                            } else if (response.status === 402) {
                                mostrarMensaje(
                                    `Pago rechazado (${resultado.detalle || "motivo no especificado"}). ` +
                                    "Puedes intentar con otra tarjeta.",
                                    "error"
                                );
                                clientRequestId = null; // fue un rechazo real, no un error de red: nueva compra, nuevo intento
                            } else if (response.status === 409) {
                                mostrarMensaje(
                                    `${resultado.message} Referencia: ${resultado.referencia}`,
                                    "error"
                                );
                            } else {
                                mostrarMensaje(
                                    resultado.message || "Ocurrió un error al procesar tu pedido.",
                                    "error"
                                );
                            }
                        } catch (error) {
                            mostrarMensaje(
                                "Error de conexión al procesar el pago. Puedes reintentar sin que se te cobre dos veces.",
                                "error"
                            );
                        } finally {
                            btnContinuar.disabled = false;
                        }
                    },

                    onError: () => {
                        mostrarMensaje("Ocurrió un error con el formulario de pago.", "error");
                        btnContinuar.disabled = false;
                    }
                }
            };

            window.cardPaymentBrickController =
                await bricksBuilder.create("cardPayment", "cardPaymentBrick_container", settings);
        };

        btnContinuar.addEventListener("click", () => {
            ocultarMensaje();

            const productoId = parseInt(selectProducto.value, 10);
            const cantidad = parseInt(inputCantidad.value, 10);

            if (!productoId || !cantidad || cantidad <= 0) {
                mostrarMensaje("Selecciona un producto y una cantidad válida.", "error");
                return;
            }

            const producto = productos.find((p) => p.id === productoId);
            if (!producto) {
                mostrarMensaje("Producto no válido. Recarga la página.", "error");
                return;
            }

            if (cantidad > producto.stock) {
                mostrarMensaje("No hay stock suficiente para esa cantidad.", "error");
                return;
            }

            btnContinuar.disabled = true; // evita el doble clic mientras se procesa

            const amount = producto.precio * cantidad;
            renderCardPaymentBrick(amount, productoId, cantidad);
        });

        cargarProductos();
    </script>

</body>
</html>
