<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales System - Checkout</title>

    <script src="https://sdk.mercadopago.com/js/v2"></script>
</head>

<body>

    <h1>Sales System</h1>
    <h2>Checkout</h2>

    <div id="seleccion_producto">
        <label for="producto">Producto:</label>
        <select id="producto"></select>

        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" min="1" value="1">

        <button id="btn_continuar">Continuar al pago</button>
    </div>

    <div id="cardPaymentBrick_container"></div>

    <script>
        const mp = new MercadoPago("APP_USR-d2252a3a-d144-4053-b917-c4ee0a6b2b21", {
            locale: "es-PE"
        });

        console.log("Mercado Pago inicializado");

        const bricksBuilder = mp.bricks();

        let productos = [];

        const cargarProductos = async () => {
            const response = await fetch("http://localhost:5000/productos");
            productos = await response.json();

            const select = document.getElementById("producto");

            productos.forEach((producto) => {
                const opcion = document.createElement("option");
                opcion.value = producto.id;
                opcion.textContent = `${producto.nombre} - S/ ${producto.precio}`;
                select.appendChild(opcion);
            });
        };

        const renderCardPaymentBrick = async (amount, productoId, cantidad) => {

            if (window.cardPaymentBrickController) {
                await window.cardPaymentBrickController.unmount();
            }

            const settings = {
                initialization: {
                    amount: amount,
                },

                callbacks: {

                    onReady: () => {
                        console.log("Card Payment Brick listo");
                    },

                    onSubmit: async (cardFormData) => {

                        const datosVenta = {
                            ...cardFormData,
                            producto_id: productoId,
                            cantidad: cantidad
                        };

                        console.log("Datos enviados al backend:", datosVenta);

                        try {

                            const response = await fetch(
                                "http://localhost:5000/process_order",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type": "application/json"
                                    },

                                    body: JSON.stringify(datosVenta)
                                }
                            );

                            const result = await response.json();

                            console.log(
                                "Respuesta del backend:",
                                result
                            );

                        } catch (error) {

                            console.error(
                                "Error al conectar con el backend:",
                                error
                            );

                        }
                    },

                    onError: (error) => {
                        console.error(
                            "Error del Card Payment Brick:",
                            error
                        );
                    }
                }
            };

            window.cardPaymentBrickController =
                await bricksBuilder.create(
                    "cardPayment",
                    "cardPaymentBrick_container",
                    settings
                );
        };

        document.getElementById("btn_continuar").addEventListener("click", () => {
            const select = document.getElementById("producto");
            const productoId = parseInt(select.value);
            const cantidad = parseInt(document.getElementById("cantidad").value);

            const producto = productos.find((p) => p.id === productoId);
            const amount = producto.precio * cantidad;

            renderCardPaymentBrick(amount, productoId, cantidad);
        });

        cargarProductos();
    </script>

</body>
</html>
