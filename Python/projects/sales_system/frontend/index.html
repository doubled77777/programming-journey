<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales System - Checkout</title>

    <script src="https://sdk.mercadopago.com/js/v2"></script>
</head>

<body>

    <h1>Sales System</h1>
    <h2>Checkout</h2>

    <div id="cardPaymentBrick_container"></div>

    <script>
        const mp = new MercadoPago("APP_USR-d2252a3a-d144-4053-b917-c4ee0a6b2b21", {
            locale: "es-PE"
        });

        console.log("Mercado Pago inicializado");

        const bricksBuilder = mp.bricks();

        const renderCardPaymentBrick = async () => {

            const settings = {
                initialization: {
                    amount: 10,
                },

                callbacks: {

                    onReady: () => {
                        console.log("Card Payment Brick listo");
                    },

                    onSubmit: async (cardFormData) => {

                        console.log("Datos recibidos:", cardFormData);

                        try {

                            const response = await fetch(
                                "http://localhost:5000/process_order",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type": "application/json"
                                    },

                                    body: JSON.stringify(cardFormData)
                                }
                            );

                            const result = await response.json();

                            console.log(
                                "Respuesta del backend:",
                                result
                            );

                        } catch (error) {

                            console.error(
                                "Error al conectar con el backend:",
                                error
                            );

                        }
                    },

                    onError: (error) => {
                        console.error(
                            "Error del Card Payment Brick:",
                            error
                        );
                    }
                }
            };

            window.cardPaymentBrickController =
                await bricksBuilder.create(
                    "cardPayment",
                    "cardPaymentBrick_container",
                    settings
                );
        };

        renderCardPaymentBrick();
    </script>

</body>
</html>
